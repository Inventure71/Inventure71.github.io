<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Debug Placeholder</title>
  <desc id="desc">Bold diagonal stripes with the word Debug Placeholder repeated for development use.</desc>
  <defs>
    <pattern id="diagonal" patternUnits="userSpaceOnUse" width="80" height="80" patternTransform="rotate(45)">
      <rect width="80" height="80" fill="#1f2937" />
      <rect width="40" height="80" fill="#f97316" />
    </pattern>
    <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="#0f172a" />
  <rect width="1200" height="800" fill="url(#diagonal)" opacity="0.85" />
  <rect width="1200" height="800" fill="#0f172a" filter="url(#noise)" opacity="0.15" />
  <g fill="#f8fafc" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="80" letter-spacing="8" opacity="0.9">
    <text x="50%" y="38%" dominant-baseline="middle" text-anchor="middle">DEBUG</text>
    <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">PLACEHOLDER</text>
    <text x="50%" y="62%" dominant-baseline="middle" text-anchor="middle">IMAGE</text>
  </g>
  <rect x="40" y="40" width="1120" height="720" rx="36" ry="36" stroke="#f8fafc" stroke-width="8" fill="none" opacity="0.5" stroke-dasharray="32 24" />
</svg>
