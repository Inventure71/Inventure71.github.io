<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="Interactive Neural Network of Project Tags" />
    <meta name="author" content="Matteo Giorgetti" />
    <title>Neural Tag Network - M.G.</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Custom Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
    <script>
        (function () {
            try {
                var storageKey = 'mg-color-theme';
                var storedTheme = localStorage.getItem(storageKey);
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = storedTheme || (prefersDark ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            } catch (error) {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <!-- Modern Design System -->
    <link href="css/modern.css" rel="stylesheet" />
    <!-- F1 Style (reusing some components) -->
    <link href="css/f1-style.css" rel="stylesheet" />
    <style>
        /* Neuron Page Specific Styles */
        .neuron-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 76px);
            /* Subtract navbar height */
            overflow: hidden;
            background: var(--color-bg-dark);
        }

        #neuron-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .neuron-ui {
            position: absolute;
            top: 2rem;
            left: 2rem;
            z-index: 10;
            pointer-events: none;
        }

        .neuron-title {
            font-size: 3rem;
            font-weight: 900;
            color: var(--color-text-light);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        .neuron-subtitle {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            max-width: 400px;
            line-height: 1.5;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .neuron-controls {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            z-index: 10;
            display: flex;
            gap: 1rem;
        }

        .neuron-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .neuron-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            color: white;
        }

        /* Overlay for project details */
        .neuron-overlay {
            position: absolute;
            top: 0;
            right: 0;
            width: 400px;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            z-index: 20;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
            overflow-y: auto;
            color: var(--color-text-light);
        }

        .neuron-overlay.active {
            transform: translateX(0);
        }

        .neuron-overlay-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: transparent;
            border: none;
            color: var(--color-text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .neuron-overlay-close:hover {
            color: white;
        }

        .tag-project-list {
            list-style: none;
            padding: 0;
            margin-top: 2rem;
        }

        .tag-project-item {
            margin-bottom: 1rem;
        }

        .tag-project-link {
            display: block;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: white;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .tag-project-link:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(-4px);
            border-color: var(--color-accent);
        }

        .tag-project-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
            display: block;
        }

        .tag-project-desc {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            display: block;
        }
    </style>
</head>

<body class="d-flex flex-column h-100 bg-dark">
    <main class="flex-shrink-0">
        <!-- Navigation-->
        <nav class="navbar navbar-expand-lg py-3 navbar-dark">
            <div class="container px-5">
                <a class="navbar-brand" href="index.html"><span class="fw-bolder">Matteo Giorgetti</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation"><span
                        class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <div class="ms-auto d-flex align-items-center flex-column flex-lg-row gap-3">
                        <ul class="navbar-nav mb-2 mb-lg-0 small fw-bolder text-center text-lg-start">
                            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="resume.html">Resume</a></li>
                            <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                            <li class="nav-item"><a class="nav-link" href="apps.html">Apps</a></li>
                            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                        </ul>
                        <button class="theme-toggle-btn mt-2 mt-lg-0" type="button" data-theme-toggle
                            aria-label="Toggle color scheme">
                            <i class="bi bi-moon"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <div class="neuron-container">
            <canvas id="neuron-canvas"></canvas>

            <div class="neuron-ui">
                <h1 class="neuron-title">Neural Network</h1>
                <p class="neuron-subtitle">Interactive visualization of project connections. Click nodes to filter
                    projects.</p>
            </div>

            <div class="neuron-controls">
                <a href="projects.html" class="neuron-btn">
                    <i class="bi bi-grid-fill"></i>
                    Grid View
                </a>
            </div>

            <aside class="neuron-overlay" id="neuron-overlay">
                <button class="neuron-overlay-close" aria-label="Close panel"><i class="bi bi-x-lg"></i></button>
                <h2 class="h2 mb-2" id="overlay-title">Tag Name</h2>
                <p class="text-muted mb-4" id="overlay-count">0 Projects</p>
                <ul class="tag-project-list" id="overlay-list">
                    <!-- Projects injected here -->
                </ul>
            </aside>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/scripts.js"></script>
    <script src="js/neuron-brain.js"></script>
</body>

</html>
