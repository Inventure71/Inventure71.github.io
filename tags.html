    <title>Neural Tag Network - M.G.</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Custom Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"

    <link href="css/styles.css" rel="stylesheet" />

<body class="playfolio-page d-flex flex-column h-100 tag-network-page">
    <main class="flex-shrink-0">
        <nav class="navbar navbar-expand-lg" data-active-page="projects"></nav>

        <div class="neuron-container">
            <canvas id="neuron-canvas"></canvas>

            <div class="neuron-ui">
                <h1 class="neuron-title">Project map</h1>
                <p class="neuron-subtitle">A clearer view of how the projects cluster around AI, interfaces, games,
                    systems, and tools.</p>
            </div>

            <div class="neuron-controls">
                <a href="projects.html" class="neuron-btn">
                    <i class="bi bi-grid-fill"></i>

                </a>
            </div>

            <aside class="neuron-overlay" id="neuron-overlay">
                <button class="neuron-overlay-close" aria-label="Close panel"><i class="bi bi-x-lg"></i></button>
                <h2 class="h2 mb-2" id="overlay-title">Tag Name</h2>
                <p class="text-muted mb-4" id="overlay-count">0 Projects</p>
                <ul class="tag-project-list" id="overlay-list">
                    <!-- Projects injected here -->
                </ul>
            </aside>
        </div>
    </main>

    <footer class="pf-footer py-4 mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
