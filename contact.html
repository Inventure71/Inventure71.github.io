<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description"
        content="Contact Matteo Giorgetti through LinkedIn, GitHub, or active professional profiles." />
    <meta name="author" content="Matteo Giorgetti" />
    <title>Contact - M.G.</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Custom Google font-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet" />
    <script src="js/theme-boot.js"></script>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <!-- Modern Design System -->
    <link href="css/modern.css" rel="stylesheet" />
    <link href="css/playfolio.css" rel="stylesheet" />
</head>

<body class="playfolio-page d-flex flex-column">
    <main class="flex-shrink-0">
        <nav class="navbar navbar-expand-lg" data-active-page="contact"></nav>
        <section class="pf-page">
            <div class="pf-shell">
                <header class="pf-section-head pf-reveal">
                    <div>
                        <h1 class="pf-section-title">Contact</h1>
                    </div>
                    <p class="pf-section-copy">The fastest way to reach me is through the profiles I already keep active.</p>
                </header>

                <div class="pf-contact-grid pf-reveal">
                    <a class="pf-contact-row" href="https://www.linkedin.com/in/matteo-giorgetti/" target="_blank"
                        rel="noopener" aria-label="Open Matteo Giorgetti on LinkedIn">
                        <span class="pf-contact-icon"><i class="bi bi-linkedin"></i></span>
                        <span>
                            <span class="pf-contact-label">LinkedIn</span>
                            <span class="pf-contact-copy">Professional profile and direct messages.</span>
                        </span>
                        <i class="bi bi-arrow-up-right"></i>
                    </a>

                    <a class="pf-contact-row" href="https://github.com/Inventure71" target="_blank" rel="noopener"
                        aria-label="Open Inventure71 on GitHub">
                        <span class="pf-contact-icon"><i class="bi bi-github"></i></span>
                        <span>
                            <span class="pf-contact-label">GitHub</span>
                            <span class="pf-contact-copy">Code, prototypes, and project history.</span>
                        </span>
                        <i class="bi bi-arrow-up-right"></i>
                    </a>
                </div>
            </div>
        </section>
    </main>
    <!-- Footer-->
    <footer class="pf-footer py-4 mt-auto"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script type="module" src="js/playfolio.js"></script>
</body>

</html>
